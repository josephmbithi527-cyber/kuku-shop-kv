<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vendor Kuku Shop KV</title>
<style>body{font-family:Arial;max-width:600px;margin:0 auto;padding:10px;background:#f0f0f0}
.order{background:white;padding:15px;border-radius:12px;margin:10px 0;border-left:5px solid green}</style>
</head>
<body>
<h2>Kuku Shop KV - Vendor - Till 0746810403</h2>
<div id="orders"></div>
<script>
async function load(){
 let res=await fetch('/api/orders'); let orders=await res.json()
 let h=""
 orders.forEach(o=>{
   h+=`<div class="order"><h3>ORDER #${o.orderNumber} - ${o.status.toUpperCase()}</h3>
   <p><b>Phone:</b> ${o.phone} | <b>Code:</b> ${o.mpesaCode}</p>
   <p><b>Place:</b> ${o.placeOfDelivery}</p>
   <p><b>Total:</b> KES ${o.total}</p>
   <p><b>Items:</b> ${o.cart.map(c=>c.name).join(', ')}</p>
   <p>${o.time}</p>
   ${o.status=='paid'?`<button onclick="confirmOrder(${o.orderNumber})" style="background:green;color:white;padding:10px;border:none;border-radius:8px">Confirm Received</button>`:''}</div>`
 })
 document.getElementById('orders').innerHTML=h
}
async function confirmOrder(num){ await fetch('/api/confirm/'+num,{method:'POST'}); load() }
setInterval(load,3000); load()
</script>
</body>
</html>
