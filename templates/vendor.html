<!DOCTYPE html>
<html>
<head><title>Vendor - Kuku Orders</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}
.order{background:white;padding:15px;margin:10px 0;border-radius:10px;box-shadow:0 2px 5px #0001;border-left:5px solid green}
.new{border-left-color:red;animation:blink 1s infinite}
@keyframes blink{50%{background:#ffe6e6}}
button{background:green;color:white;border:none;padding:10px 20px;border-radius:5px}
</style>
</head>
<body>
<h1>🐔 KUKU ORDERS - Live</h1>
<p>Keep this page open - it beeps for new orders!</p>
<div id="orders">Loading...</div>
<audio id="beep" src="https://www.soundjay.com/buttons/sounds/beep-07a.mp3" preload="auto"></audio>
<script>
let lastCount=0;
async function load(){
  let res=await fetch('/api/orders');
  let data=await res.json();
  let div=document.getElementById('orders');
  div.innerHTML='';
  if(data.length>lastCount && lastCount>0){
    document.getElementById('beep').play();
    if(Notification) new Notification('NEW KUKU ORDER! KES '+data[data.length-1].total);
    alert('🔔 NEW ORDER! KES '+data[data.length-1].total+' From '+data[data.length-1].phone);
  }
  lastCount=data.length;
  data.reverse().forEach(o=>{
    div.innerHTML+=`<div class="order ${o.status=='paid'?'new':''}"><b>ORDER #${o.orderNumber} - KES ${o.total}</b><br>📞 ${o.phone}<br>📍 ${o.placeOfDelivery}<br>💳 Mpesa: ${o.mpesaCode}<br>🛒 ${JSON.stringify(o.cart)}<br>⏰ ${o.time} - ${o.status}<br><button onclick="confirmOrder(${o.orderNumber})">Confirm Order</button></div>`;
  });
}
async function confirmOrder(n){await fetch('/api/confirm/'+n,{method:'POST'}); load();}
setInterval(load,5000); load();
if(Notification) Notification.requestPermission();
</script>
</body>
</html>
